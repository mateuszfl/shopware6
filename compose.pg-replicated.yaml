name: shopware-pg-replicated

x-pg-image: &pg-image postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
x-pg-health: &pg-health
  test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d shopware_pg']
  interval: 5s
  timeout: 3s
  retries: 24
  start_period: 10s

services:
  pg-primary:
    image: *pg-image
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopware_pg
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
      CREATE_REPLICATION_SLOTS: '1'
      TZ: UTC
      PGTZ: UTC
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=10, -c, max_replication_slots=10, -c, max_slot_wal_keep_size=256MB, -c, wal_keep_size=64MB, -c, timezone=UTC]
    volumes:
      - pg-primary-data:/var/lib/postgresql
      - ./dev-tools/database/postgres-primary-init.sh:/docker-entrypoint-initdb.d/10-shopware.sh:ro
    ports:
      - '5434:5432'
    healthcheck: *pg-health

  pg-replica-0:
    image: *pg-image
    entrypoint: [/bin/bash, /usr/local/bin/postgres-standby.sh]
    environment:
      REPLICATION_SLOT: shopware_replica_0
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pg-replica-0-data:/var/lib/postgresql
      - ./dev-tools/database/postgres-standby.sh:/usr/local/bin/postgres-standby.sh:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    ports:
      - '5435:5432'
    healthcheck: *pg-health

  pg-replica-1:
    profiles: [second-replica]
    image: *pg-image
    entrypoint: [/bin/bash, /usr/local/bin/postgres-standby.sh]
    environment:
      REPLICATION_SLOT: shopware_replica_1
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pg-replica-1-data:/var/lib/postgresql
      - ./dev-tools/database/postgres-standby.sh:/usr/local/bin/postgres-standby.sh:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    ports:
      - '5436:5432'
    healthcheck: *pg-health

  web:
    build:
      context: .
      dockerfile: dev-tools/database/Dockerfile.web
    ports:
      - '8000:8000'
    environment:
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev
      HOST: 0.0.0.0
      APP_URL: http://localhost:8000
      DATABASE_URL: postgresql://shopware:shopware@pg-primary:5432/shopware_pg?serverVersion=18.6&charset=utf8
      DATABASE_REPLICA_0_URL: postgresql://shopware:shopware@pg-replica-0:5432/shopware_pg?serverVersion=18.6&charset=utf8
      DATABASE_CONTROL_URL: postgresql://postgres:postgres@pg-primary:5432/shopware_pg?serverVersion=18.6
      MAILER_DSN: smtp://mailer:1025
    volumes:
      - .:/var/www/html
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-replica-0:
        condition: service_healthy

  adminer:
    image: adminer:latest
    ports:
      - '9081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: pg-primary

volumes:
  pg-primary-data:
  pg-replica-0-data:
  pg-replica-1-data:
