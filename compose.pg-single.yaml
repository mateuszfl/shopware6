name: shopware-pg-single

services:
  pg-single:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopware_pg
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pg-single-data:/var/lib/postgresql
      - ./dev-tools/database/postgres-primary-init.sh:/docker-entrypoint-initdb.d/10-shopware.sh:ro
    ports:
      - '5433:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d shopware_pg']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: dev-tools/database/Dockerfile.web
    ports:
      - '8000:8000'
    environment:
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev
      HOST: 0.0.0.0
      APP_URL: http://localhost:8000
      DATABASE_URL: postgresql://shopware:shopware@pg-single:5432/shopware_pg?serverVersion=18.6&charset=utf8
      DATABASE_CONTRACT_URL: postgresql://shopware:shopware@pg-single:5432/shopware_pg_test?serverVersion=18.6&charset=utf8
      MAILER_DSN: smtp://mailer:1025
    volumes:
      - .:/var/www/html
    depends_on:
      pg-single:
        condition: service_healthy

  adminer:
    image: adminer:latest
    ports:
      - '9081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: pg-single

volumes:
  pg-single-data:
